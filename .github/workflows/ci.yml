name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    name: Windows (vcpkg)
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      # Binary cache: vcpkg stores built packages here; actions/cache persists it across runs.
      # (Classic mode + caching the whole vcpkg/ tree exceeded GitHub's 10 GB limit and never saved.)
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite
    steps:
      - uses: actions/checkout@v5

      # Prefer shell/choco over Node-20 actions (setup-nasm / get-cmake / msvc-dev-cmd).
      - name: Install NASM, Ninja, CMake
        shell: pwsh
        run: |
          choco install nasm ninja -y --no-progress
          $ver = "3.31.6"
          $zip = Join-Path $env:RUNNER_TEMP "cmake.zip"
          $dest = Join-Path $env:RUNNER_TEMP "cmake"
          Invoke-WebRequest `
            "https://github.com/Kitware/CMake/releases/download/v$ver/cmake-$ver-windows-x86_64.zip" `
            -OutFile $zip
          Expand-Archive $zip -DestinationPath $dest -Force
          Add-Content $env:GITHUB_PATH (Join-Path $dest "cmake-$ver-windows-x86_64\bin")
          # NASM installer path is not always on PATH for subsequent steps.
          Add-Content $env:GITHUB_PATH "C:\Program Files\NASM"

      - name: Restore vcpkg binary cache
        id: vcpkg-bincache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-bincache-${{ runner.os }}-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-x64-

      - name: Ensure binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/vcpkg-binary-cache" | Out-Null
          $n = (Get-ChildItem "$env:GITHUB_WORKSPACE/vcpkg-binary-cache" -Recurse -File -ErrorAction SilentlyContinue | Measure-Object).Count
          Write-Host "vcpkg binary cache restore: cache-hit=${{ steps.vcpkg-bincache.outputs.cache-hit }}, files=$n"

      - name: Setup vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $root = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          if (-not (Test-Path (Join-Path $root ".git"))) {
            if (Test-Path $root) { Remove-Item -Recurse -Force $root }
            New-Item -ItemType Directory -Path $root | Out-Null
            git -C $root init
            git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          }
          git -C $root fetch --depth 1 origin $baseline
          git -C $root checkout --force FETCH_HEAD
          if (-not (Test-Path (Join-Path $root "vcpkg.exe"))) {
            & (Join-Path $root "bootstrap-vcpkg.bat") -disableMetrics
          }
          "VCPKG_ROOT=$root" | Add-Content $env:GITHUB_ENV

      - name: Configure
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          )
          rem vcvars64.bat points VCPKG_ROOT at VS's bundled vcpkg; use the tree we bootstrapped.
          set VCPKG_ROOT=%GITHUB_WORKSPACE%\vcpkg
          cmake --preset vcpkg-manifest -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          )
          set VCPKG_ROOT=%GITHUB_WORKSPACE%\vcpkg
          cmake --build --preset vcpkg-manifest

      - name: Test
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do (
            call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          )
          ctest --test-dir build --output-on-failure -j %NUMBER_OF_PROCESSORS%

      # Always save: configure may build packages missing from a partial cache restore.
      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-bincache-${{ runner.os }}-x64-${{ hashFiles('vcpkg.json') }}

      - name: Collect failure logs
        if: failure()
        shell: pwsh
        run: |
          $out = "ci-failure-logs"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $patterns = @(
            'build/CMakeFiles/CMakeError.log',
            'build/CMakeFiles/CMakeOutput.log',
            'build/CMakeCache.txt',
            'vcpkg/buildtrees/*/*err*.log',
            'vcpkg/buildtrees/*/*out*.log',
            'vcpkg/buildtrees/*/install-*.log',
            'vcpkg/buildtrees/*/config-*-rel-*.log'
          )
          foreach ($pat in $patterns) {
            Get-ChildItem -Path $pat -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 40 |
              ForEach-Object {
                $dest = Join-Path $out ($_.Name + '-' + $_.Directory.Name)
                Copy-Item $_.FullName $dest -ErrorAction SilentlyContinue
                Write-Host "===== $($_.FullName) ====="
                Get-Content $_.FullName -Tail 60 -ErrorAction SilentlyContinue
              }
          }
          Get-ChildItem $out -File -ErrorAction SilentlyContinue | ForEach-Object {
            Select-String -Path $_.FullName -Pattern 'error:|FAILED|CMake Error|ninja: error' -SimpleMatch:$false |
              Select-Object -Last 30 |
              ForEach-Object { Write-Host $_.Line }
          }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-ci-failure-logs
          path: ci-failure-logs/
          if-no-files-found: ignore

  linux:
    name: Linux (apt)
    runs-on: ubuntu-latest
    env:
      GLSLANG_PREFIX: /home/runner/.cache/mango-glslang
      CMAKE_PREFIX_PATH: /home/runner/.cache/mango-glslang
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config git \
            libx11-dev libxext-dev libxrandr-dev libx11-xcb-dev \
            libxcb1-dev libxcb-xkb-dev libxcb-keysyms1-dev \
            libxcb-icccm4-dev libxcb-randr0-dev libxcb-sync-dev \
            libxcb-glx0-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols \
            libfmt-dev zlib1g-dev libdeflate-dev libzstd-dev liblcms2-dev \
            libopenjp2-7-dev libwebp-dev libavif-dev libheif-dev \
            libraw-dev libisal-dev liblz4-dev libbz2-dev libjxr-dev \
            mesa-common-dev libgl1-mesa-dev libvulkan-dev \
            libfreetype-dev libharfbuzz-dev libsimdjson-dev \
            libjpeg-dev libpng-dev
          # libjxl-dev omitted: Ubuntu noble ships 0.7; mango needs >= 0.9 (see mango_find_module.cmake).

      # Ubuntu glslang-dev ships a broken CMake config (missing tool targets).
      # Build a known-good glslang from upstream; everything else stays on apt.
      - name: Cache glslang
        id: cache-glslang
        uses: actions/cache@v5
        with:
          path: ${{ env.GLSLANG_PREFIX }}
          key: glslang-15.1.0-linux

      - name: Install glslang (Khronos)
        if: steps.cache-glslang.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 15.1.0 https://github.com/KhronosGroup/glslang.git /tmp/glslang
          cmake -S /tmp/glslang -B /tmp/glslang-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_OPT=OFF \
            -DCMAKE_INSTALL_PREFIX="$GLSLANG_PREFIX"
          cmake --build /tmp/glslang-build -j"$(nproc)"
          cmake --install /tmp/glslang-build

      - name: Configure and build
        run: |
          cmake --preset default
          cmake --build --preset default

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

  macos:
    name: macOS (brew)
    runs-on: macos-latest
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          brew install cmake ninja fmt zlib libdeflate zstd lcms2 jpeg-xl openjpeg webp \
            libavif libheif libraw isa-l lz4 bzip2 jxrlib freetype harfbuzz \
            simdjson libjpeg-turbo libpng glslang molten-vk vulkan-headers \
            vulkan-loader

      - name: Configure and build
        run: |
          cmake --preset default
          cmake --build --preset default

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(sysctl -n hw.ncpu)"
