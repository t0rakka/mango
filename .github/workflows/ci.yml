name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  windows:
    name: Windows (vcpkg)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v3.31.6

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure and build
        uses: lukka/run-cmake@v10
        with:
          configurePreset: vcpkg-manifest
          buildPreset: vcpkg-manifest

  linux:
    name: Linux (apt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev \
            libfmt-dev zlib1g-dev libdeflate-dev libzstd-dev liblcms2-dev \
            libjxl-dev libopenjp2-7-dev libwebp-dev libavif-dev libheif-dev \
            libraw-dev libisal-dev liblz4-dev libbz2-dev libjxr-dev \
            mesa-common-dev libgl1-mesa-dev libvulkan-dev \
            libfreetype-dev libharfbuzz-dev libsimdjson-dev \
            libjpeg-dev libpng-dev

      # Ubuntu's glslang-dev CMake package is incomplete (missing tool targets).
      # Install glslang from vcpkg; everything else stays on apt.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Install glslang (vcpkg)
        run: ${{ github.workspace }}/vcpkg/vcpkg install glslang --triplet x64-linux

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v3.31.6

      - name: Configure and build
        uses: lukka/run-cmake@v10
        with:
          configurePreset: default
          buildPreset: default
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/vcpkg/installed/x64-linux

  macos:
    name: macOS (brew)
    runs-on: macos-latest
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install fmt zlib libdeflate zstd lcms2 jpeg-xl openjpeg webp \
            libavif libheif libraw isa-l lz4 bzip2 jxrlib freetype harfbuzz \
            simdjson libjpeg-turbo libpng glslang molten-vk vulkan-headers \
            vulkan-loader

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v3.31.6

      - name: Configure and build
        uses: lukka/run-cmake@v10
        with:
          configurePreset: default
          buildPreset: default
